name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer scripts
        run: gh release upload "${GITHUB_REF_NAME}" scripts/install.sh scripts/install.ps1 scripts/install-choco.ps1 --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chocolatey:
    needs: goreleaser
    runs-on: windows-latest
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/checksums.txt" -OutFile "dist/checksums.txt"

      - name: Build Chocolatey package
        shell: pwsh
        run: ./scripts/build-chocolatey.ps1 -Version "${{ github.ref_name }}" -ChecksumsPath "dist/checksums.txt"

      - name: Upload Chocolatey package to release
        shell: pwsh
        run: |
          $nupkg = (Get-ChildItem "dist/chocolatey/agent-brain/*.nupkg" | Select-Object -First 1).FullName
          gh release upload "${env:GITHUB_REF_NAME}" $nupkg --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Chocolatey package
        if: ${{ env.CHOCOLATEY_API_KEY != '' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $nupkg = (Get-ChildItem "dist/chocolatey/agent-brain/*.nupkg" | Select-Object -First 1).FullName
          choco push $nupkg --source https://push.chocolatey.org/ --api-key "${env:CHOCOLATEY_API_KEY}"

  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Set package version
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Pack npm package
        run: npm pack

      - name: Upload npm package to release
        run: gh release upload "${GITHUB_REF_NAME}" ./*.tgz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm package
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        continue-on-error: true
        run: npm publish --access public
