project_name: agent-brain
project_id: agent-brain-local
repo_root: .
runtime_namespace: agent-brain-local
neo4j_uri: bolt://localhost:7687
neo4j_http_port: 7474
neo4j_bolt_port: 7687
neo4j_user: neo4j
neo4j_password: agentbrain
sqlite_path: .agent-brain/runtime/metadata.sqlite
context_output_dir: .ai/context
rules_dir: .agent-brain/rules
ignore_patterns:
  - .git
  - vendor
  - node_modules
  - dist
  - build
  - target
  - bin
  - coverage
  - .env
  - .env.*
  - "*.pem"
  - "*.key"
  - credentials
  - secrets
  - kubeconfig
  - id_rsa
  - id_ed25519
